<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2F4A3A">
  <title>潘琰工作台 · 个人学习工作台</title>
  <link rel="stylesheet" href="css/style.css?v=42">
</head>
<body>
  <div class="ink-bg" aria-hidden="true"></div>
  <div class="app">
    <!-- 侧边导航（桌面端） -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="seal">潘</div>
          <div>
            <div class="brand-cn">潘琰工作台</div>
            <div class="sidebar-logo-sub">PAN YAN · STUDY DESK</div>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        潘琰 · Supabase 云端同步 · v1.5
      </div>
    </aside>

    <!-- 主内容区 -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-title">今日</div>
        <div class="topbar-actions">
          <button class="btn-secondary" style="padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px" onclick="navigate('search')" title="全局搜索">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            搜索
          </button>
        </div>
      </header>
      <main class="page"></main>
    </div>
  </div>

  <!-- 手机端底部导航 -->
  <nav class="bottomnav">
    <div class="bottomnav-items"></div>
  </nav>

  <!-- 手机端更多抽屉 -->
  <div class="mobile-menu-backdrop" onclick="closeDrawer()"></div>
  <div class="mobile-menu-drawer"></div>

  <!-- Toast 容器 -->
  <div class="toast-container"></div>

  <!-- 先加载图标库，再加载数据层、Supabase 同步层、AI、新闻、主控制器 -->
  <script src="js/config.js?v=42"></script>
  <script src="js/icons.js?v=41"></script>
  <script src="js/store.js?v=43"></script>
  <script src="js/sync.js?v=42"></script>
  <script src="js/ai.js?v=42"></script>
  <script src="js/news.js?v=42"></script>
  <script src="js/app.js?v=42"></script>
</body>
</html>
